id: poc-31-cinescope-tmdb
name: CineScope Film and TV Analytics
version: 1.0.0
services:
  auth:
    enabled: true
    expiryInMinutes: 60
    refreshToken:
      lifetimeInDays: 7
    customClaims:
      app: cinescope-tmdb
      poc: "31"
    scopes:
      - read:data
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5173/auth/callback
      - https://safe-pond-a9f656b9e5-westeurope.webapp.fabricapps.net
    password:
      enabled: true
    fabric:
      enabled: true
    passwordless:
      magicLink:
        enabled: false
        expiryMinutes: 15
      smsOtp:
        enabled: false
    email:
      enabled: false
  data:
    enabled: true
    dialect: mssql
  storage:
    enabled: false
  staticHosting:
    enabled: true
    root: .
    folder: dist
    buildCommand: npm run build
    indexDocument: index.html
  functions:
    enabled: false
